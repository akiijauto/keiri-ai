# XcodeGen 定義（xcodegen generate で SecureLocalOcr.xcodeproj を生成する）
#
# .xcodeproj をリポジトリに置かないのは、
#  - 生成物であり差分が読めない
#  - 個人の設定（署名情報など）が混入しやすい
# ため。構成はこのYAMLを唯一の正とする。
name: SecureLocalOcr
options:
  bundleIdPrefix: jp.slo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  SloCore:
    path: SloCore

targets:
  SecureLocalOcr:
    type: application
    platform: iOS
    sources:
      - path: SecureLocalOcr
    dependencies:
      - package: SloCore
        product: SloCore
    info:
      path: SecureLocalOcr/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.slo.ios
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone と iPad
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # iCloud/バックアップへ業務データを載せない方針は AuditFileLog 側でも実施する
