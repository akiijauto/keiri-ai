<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>入居申込書（画面表示用・縦・架空データ）</title>
<style>
  /*
    別の画面（スマホ等）に表示して、タブレットで撮影するためのサンプル。
    紙のA4を撮る場合と違い、画面撮影は
      - 文字が小さくなる
      - backlight とモアレで輪郭が甘くなる
    ため、印刷用の用紙より文字を大きく、線を太く、余計な装飾を省いている。
  */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "IPAexGothic", sans-serif;
    background: #fff; color: #000;
    padding: 48px 40px;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: none;
  }
  h1 {
    font-size: 60px; font-weight: 700; text-align: center;
    letter-spacing: .12em; margin-bottom: 10px;
  }
  .note {
    text-align: center; font-size: 24px; margin-bottom: 34px;
    border: 3px solid #000; padding: 12px;
  }
  table { width: 100%; border-collapse: collapse; flex: 1; }
  th, td { border: 3px solid #000; padding: 18px 20px; text-align: left; }
  th {
    width: 34%; font-size: 30px; font-weight: 500; background: #ececec;
    white-space: nowrap;
  }
  td { font-size: 40px; font-weight: 700; }
</style>
</head>
<body>
  <h1>入居申込書</h1>
  <div class="note">読み取り検証用・記載内容はすべて架空です</div>
  <table>
    <tr><th>お客様番号</th><td>CUS-1024</td></tr>
    <tr><th>氏名</th><td>山田　太郎</td></tr>
    <tr><th>フリガナ</th><td>ヤマダ　タロウ</td></tr>
    <tr><th>生年月日</th><td>昭和55年1月1日</td></tr>
    <tr><th>郵便番号</th><td>〒150-0001</td></tr>
    <tr><th>住所</th><td>東京都渋谷区神宮前１－２－３</td></tr>
    <tr><th>電話番号</th><td>090-1234-5678</td></tr>
    <tr><th>メールアドレス</th><td>taro.yamada@example.co.jp</td></tr>
    <tr><th>入居予定日</th><td>令和8年4月1日</td></tr>
  </table>
</body>
</html>
