<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>入居申込書（検証用・架空データ）</title>
<style>
  @page { size: A4; margin: 14mm; }
  body {
    font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "IPAexGothic", sans-serif;
    color: #000; background: #fff; margin: 0; font-size: 12pt; line-height: 1.6;
  }
  .sheet { width: 182mm; }
  h1 { font-size: 18pt; text-align: center; margin: 0 0 2mm; letter-spacing: .3em; }
  .caution {
    border: 1.5pt solid #000; padding: 3mm; margin-bottom: 5mm;
    font-size: 9pt; text-align: center; letter-spacing: .05em;
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { border: 1pt solid #000; padding: 3.2mm 3mm; vertical-align: middle; }
  th { width: 34mm; background: #f0f0f0; font-weight: normal; text-align: left; font-size: 11pt; }
  td { font-size: 13pt; }
  .small { font-size: 8.5pt; }
  .footnote { margin-top: 6mm; font-size: 8.5pt; }
  .stamp { margin-top: 8mm; display: flex; gap: 6mm; align-items: flex-start; }
  .stamp .box { border: 1pt solid #000; width: 26mm; height: 22mm; text-align: center; font-size: 8pt; padding-top: 1.5mm; }
</style>
</head>
<body>
<div class="sheet">
  <h1>入居申込書</h1>
  <div class="caution">この用紙は読み取り検証専用です。記載されている情報はすべて架空のものです。</div>

  <table>
    <tr><th>お客様番号</th><td>CUS-1024</td></tr>
    <tr><th>氏名</th><td>山田　太郎</td></tr>
    <tr><th>フリガナ</th><td>ヤマダ　タロウ</td></tr>
    <tr><th>生年月日</th><td>昭和55年1月1日</td></tr>
    <tr><th>郵便番号</th><td>〒150-0001</td></tr>
    <tr><th>住所</th><td>東京都渋谷区神宮前１－２－３<br>グランドメゾン渋谷 401</td></tr>
    <tr><th>電話番号</th><td>090-1234-5678</td></tr>
    <tr><th>メールアドレス</th><td>taro.yamada@example.co.jp</td></tr>
    <tr><th>入居予定日</th><td>令和8年4月1日</td></tr>
    <tr><th>勤務先</th><td>株式会社サンプル商事</td></tr>
    <tr><th>備考</th><td class="small">駐車場の利用を希望します。連絡は平日の午前中にお願いします。</td></tr>
  </table>

  <div class="stamp">
    <div class="box">受付印</div>
    <div class="box">確認印</div>
    <div class="small">
      ※この欄は記入しないでください<br>
      受付番号 -----
    </div>
  </div>

</div>
</body>
</html>
